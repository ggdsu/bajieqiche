<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猪八戒骑自行车</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    background: linear-gradient(180deg, #d8eefc 0%, #eef7ff 100%);
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
  }
  .card {
    width: min(92vw, 880px);
    background: #ffffff;
    border-radius: 20px;
    padding: 14px;
    box-shadow: 0 14px 40px rgba(60, 100, 150, 0.18);
  }
  svg { display: block; width: 100%; height: auto; border-radius: 14px; }
  .caption { color: #5b708a; font-size: 15px; letter-spacing: 2px; }

  /* 车轮与太阳光旋转 */
  .wheel-spin, .sun-rays {
    transform-box: fill-box;
    transform-origin: center;
  }
  .wheel-spin { animation: spin 1s linear infinite; }
  .sun-rays { animation: spin 16s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 猪八戒轻微起伏 */
  .pig-bob { animation: bob 0.7s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-4px); } }

  /* 云朵飘动 */
  .cloud { animation: drift 12s ease-in-out infinite alternate; }
  .cloud.slow { animation-duration: 17s; animation-delay: -5s; }
  @keyframes drift { from { transform: translateX(-28px); } to { transform: translateX(46px); } }

  /* 速度线 */
  .speed { stroke-dasharray: 28 20; animation: dash 0.55s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -48; } }
</style>
</head>
<body>

<div class="card">
<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="猪八戒骑自行车">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cc4f5"/>
      <stop offset="1" stop-color="#d9f2ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c8794"/>
      <stop offset="1" stop-color="#5f6a76"/>
    </linearGradient>
  </defs>

  <!-- 天空 -->
  <rect x="0" y="0" width="900" height="620" fill="url(#sky)"/>

  <!-- 太阳 -->
  <circle cx="795" cy="95" r="60" fill="#ffd43b" opacity="0.25"/>
  <g class="sun-rays" stroke="#ffd43b" stroke-width="7" stroke-linecap="round">
    <line x1="795" y1="47" x2="795" y2="29"/>
    <line x1="795" y1="143" x2="795" y2="161"/>
    <line x1="747" y1="95" x2="729" y2="95"/>
    <line x1="843" y1="95" x2="861" y2="95"/>
    <line x1="761" y1="61" x2="748" y2="48"/>
    <line x1="829" y1="61" x2="842" y2="48"/>
    <line x1="761" y1="129" x2="748" y2="142"/>
    <line x1="829" y1="129" x2="842" y2="142"/>
  </g>
  <circle cx="795" cy="95" r="38" fill="#ffd43b"/>

  <!-- 云朵 -->
  <g transform="translate(150,105)">
    <g class="cloud" fill="#ffffff" opacity="0.95">
      <ellipse cx="0" cy="0" rx="46" ry="20"/>
      <ellipse cx="42" cy="-12" rx="40" ry="22"/>
      <ellipse cx="84" cy="0" rx="44" ry="18"/>
      <ellipse cx="42" cy="10" rx="62" ry="16"/>
    </g>
  </g>
  <g transform="translate(560,72) scale(0.85)">
    <g class="cloud slow" fill="#ffffff" opacity="0.9">
      <ellipse cx="0" cy="0" rx="46" ry="20"/>
      <ellipse cx="42" cy="-12" rx="40" ry="22"/>
      <ellipse cx="84" cy="0" rx="44" ry="18"/>
      <ellipse cx="42" cy="10" rx="62" ry="16"/>
    </g>
  </g>
  <g transform="translate(350,170) scale(0.6)" opacity="0.85">
    <g class="cloud" fill="#ffffff">
      <ellipse cx="0" cy="0" rx="46" ry="20"/>
      <ellipse cx="42" cy="-12" rx="40" ry="22"/>
      <ellipse cx="84" cy="0" rx="44" ry="18"/>
      <ellipse cx="42" cy="10" rx="62" ry="16"/>
    </g>
  </g>

  <!-- 远山 -->
  <path d="M 0 480 Q 180 375 400 465 Q 610 360 900 465 L 900 620 L 0 620 Z" fill="#a5e08f"/>
  <!-- 近山 -->
  <path d="M 0 525 Q 240 440 480 505 Q 700 445 900 505 L 900 620 L 0 620 Z" fill="#7ac96b"/>

  <!-- 树 -->
  <rect x="104" y="428" width="14" height="52" rx="4" fill="#8d5a3a"/>
  <circle cx="111" cy="392" r="36" fill="#3f9d4e"/>
  <circle cx="88" cy="410" r="26" fill="#46b456"/>
  <circle cx="134" cy="410" r="26" fill="#46b456"/>
  <rect x="753" y="412" width="15" height="58" rx="4" fill="#8d5a3a"/>
  <circle cx="760" cy="374" r="38" fill="#3f9d4e"/>
  <circle cx="736" cy="394" r="27" fill="#46b456"/>
  <circle cx="784" cy="394" r="27" fill="#46b456"/>

  <!-- 小花 -->
  <g>
    <line x1="170" y1="512" x2="170" y2="496" stroke="#3f9d4e" stroke-width="3"/>
    <circle cx="165" cy="492" r="4" fill="#ff8fab"/>
    <circle cx="175" cy="492" r="4" fill="#ff8fab"/>
    <circle cx="170" cy="486" r="4" fill="#ff8fab"/>
    <circle cx="170" cy="492" r="3.5" fill="#ffd43b"/>
    <line x1="690" y1="508" x2="690" y2="492" stroke="#3f9d4e" stroke-width="3"/>
    <circle cx="685" cy="488" r="4" fill="#ff8fab"/>
    <circle cx="695" cy="488" r="4" fill="#ff8fab"/>
    <circle cx="690" cy="482" r="4" fill="#ff8fab"/>
    <circle cx="690" cy="488" r="3.5" fill="#ffd43b"/>
    <line x1="835" y1="516" x2="835" y2="500" stroke="#3f9d4e" stroke-width="3"/>
    <circle cx="830" cy="496" r="4" fill="#ff8fab"/>
    <circle cx="840" cy="496" r="4" fill="#ff8fab"/>
    <circle cx="835" cy="490" r="4" fill="#ff8fab"/>
    <circle cx="835" cy="496" r="3.5" fill="#ffd43b"/>
  </g>

  <!-- 公路 -->
  <rect x="0" y="520" width="900" height="100" fill="url(#road)"/>
  <rect x="0" y="520" width="900" height="7" fill="#98a2ae"/>
  <line x1="0" y1="572" x2="900" y2="572" stroke="#f8f9fa" stroke-width="6" stroke-dasharray="42 34" opacity="0.9"/>

  <!-- 车影 -->
  <ellipse cx="457" cy="526" rx="185" ry="10" fill="#000000" opacity="0.14"/>

  <!-- 速度线 -->
  <g stroke="#79c7f2" stroke-width="6" stroke-linecap="round">
    <line class="speed" x1="120" y1="360" x2="235" y2="360"/>
    <line class="speed" x1="140" y1="405" x2="255" y2="405"/>
    <line class="speed" x1="115" y1="450" x2="225" y2="450"/>
  </g>

  <!-- ============ 自行车 ============ -->
  <g id="bike">
    <!-- 后轮 -->
    <g class="wheel-spin">
      <circle cx="330" cy="465" r="55" fill="none" stroke="#343a40" stroke-width="8"/>
      <circle cx="330" cy="465" r="44" fill="none" stroke="#adb5bd" stroke-width="3.5"/>
      <g stroke="#ced4da" stroke-width="2.5">
        <line x1="286" y1="465" x2="374" y2="465"/>
        <line x1="330" y1="421" x2="330" y2="509"/>
        <line x1="299" y1="434" x2="361" y2="496"/>
        <line x1="361" y1="434" x2="299" y2="496"/>
      </g>
      <circle cx="330" cy="465" r="9" fill="#495057"/>
    </g>
    <!-- 前轮 -->
    <g class="wheel-spin">
      <circle cx="585" cy="465" r="55" fill="none" stroke="#343a40" stroke-width="8"/>
      <circle cx="585" cy="465" r="44" fill="none" stroke="#adb5bd" stroke-width="3.5"/>
      <g stroke="#ced4da" stroke-width="2.5">
        <line x1="541" y1="465" x2="629" y2="465"/>
        <line x1="585" y1="421" x2="585" y2="509"/>
        <line x1="554" y1="434" x2="616" y2="496"/>
        <line x1="616" y1="434" x2="554" y2="496"/>
      </g>
      <circle cx="585" cy="465" r="9" fill="#495057"/>
    </g>

    <!-- 链条 -->
    <line x1="330" y1="456" x2="432" y2="452" stroke="#343a40" stroke-width="4"/>
    <line x1="330" y1="474" x2="432" y2="478" stroke="#343a40" stroke-width="4"/>

    <!-- 车架 -->
    <path d="M 330 465 L 392 352 L 562 358 L 432 465 L 330 465"
          fill="none" stroke="#e63946" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="392" y1="352" x2="432" y2="465" stroke="#e63946" stroke-width="9" stroke-linecap="round"/>
    <line x1="562" y1="358" x2="585" y2="465" stroke="#e63946" stroke-width="9" stroke-linecap="round"/>

    <!-- 车把 -->
    <line x1="562" y1="358" x2="556" y2="316" stroke="#495057" stroke-width="7" stroke-linecap="round"/>
    <path d="M 556 316 Q 538 300 520 308" fill="none" stroke="#495057" stroke-width="7" stroke-linecap="round"/>
    <circle cx="521" cy="308" r="6" fill="#212529"/>
    <circle cx="540" cy="300" r="5" fill="#ffd43b"/>

    <!-- 座管 + 车座 -->
    <line x1="392" y1="352" x2="386" y2="322" stroke="#495057" stroke-width="7" stroke-linecap="round"/>
    <path d="M 354 322 Q 386 306 420 320 Q 386 334 354 322 Z" fill="#343a40"/>

    <!-- 曲柄 + 踏板 -->
    <circle cx="432" cy="465" r="12" fill="#495057" stroke="#343a40" stroke-width="3"/>
    <line x1="432" y1="465" x2="404" y2="441" stroke="#495057" stroke-width="6" stroke-linecap="round"/>
    <line x1="432" y1="465" x2="460" y2="489" stroke="#495057" stroke-width="6" stroke-linecap="round"/>
    <rect x="391" y="435" width="26" height="8" rx="3" fill="#212529"/>
    <rect x="447" y="483" width="26" height="8" rx="3" fill="#212529"/>

    <!-- 前车篮 -->
    <path d="M 506 318 L 556 318 L 548 354 L 514 354 Z" fill="#e9b872" stroke="#c98d4b" stroke-width="2.5" stroke-linejoin="round"/>
    <g stroke="#c98d4b" stroke-width="2">
      <line x1="521" y1="320" x2="518" y2="352"/>
      <line x1="533" y1="320" x2="531" y2="352"/>
      <line x1="544" y1="320" x2="542" y2="352"/>
    </g>
    <circle cx="520" cy="313" r="5.5" fill="#ff6b81"/>
    <circle cx="533" cy="309" r="5.5" fill="#ffd43b"/>
    <circle cx="546" cy="313" r="5.5" fill="#ff9f43"/>
    <ellipse cx="527" cy="315" rx="4" ry="2.5" fill="#3f9d4e"/>
    <ellipse cx="540" cy="314" rx="4" ry="2.5" fill="#3f9d4e"/>
  </g>

  <!-- ============ 猪八戒 ============ -->
  <g class="pig-bob">
    <!-- 远侧腿 -->
    <path d="M 398 328 Q 432 400 456 480" fill="none" stroke="#ef8fa8" stroke-width="18" stroke-linecap="round"/>
    <ellipse cx="458" cy="487" rx="12" ry="7" fill="#d96a8e"/>
    <!-- 近侧腿 -->
    <path d="M 372 332 Q 392 396 406 436" fill="none" stroke="#f9b3c6" stroke-width="18" stroke-linecap="round"/>
    <ellipse cx="406" cy="435" rx="12" ry="7" fill="#e8799a"/>

    <!-- 围巾 -->
    <path d="M 452 252 C 402 234 368 242 332 222 L 340 242 C 374 254 410 254 450 268 Z" fill="#e63946"/>

    <!-- 尾巴 -->
    <path d="M 325 292 q -20 -2 -16 -18 q 3 -13 17 -9" fill="none" stroke="#f191ad" stroke-width="5" stroke-linecap="round"/>

    <!-- 身体 -->
    <ellipse cx="385" cy="298" rx="62" ry="48" fill="#f9b3c6"/>
    <ellipse cx="398" cy="314" rx="38" ry="26" fill="#fdd3de" opacity="0.7"/>

    <!-- 远侧手臂 -->
    <path d="M 428 272 Q 500 284 544 310" fill="none" stroke="#ef8fa8" stroke-width="15" stroke-linecap="round"/>
    <circle cx="545" cy="312" r="9.5" fill="#ef8fa8"/>

    <!-- 远侧耳朵 -->
    <path d="M 470 180 Q 448 128 415 140 Q 424 184 456 196 Z" fill="#ef8fa8"/>

    <!-- 头 -->
    <circle cx="498" cy="225" r="54" fill="#f9b3c6"/>

    <!-- 近侧耳朵 -->
    <path d="M 508 176 Q 528 122 562 136 Q 556 182 520 194 Z" fill="#f191ad"/>
    <path d="M 517 172 Q 531 142 550 150 Q 545 177 523 185 Z" fill="#d96a8e" opacity="0.5"/>

    <!-- 红头巾 -->
    <path d="M 450 200 Q 498 178 546 193 L 544 209 Q 498 195 452 215 Z" fill="#e63946"/>
    <path d="M 452 206 L 412 188 L 424 211 Z" fill="#e63946"/>
    <path d="M 452 212 L 408 224 L 426 231 Z" fill="#c92a3a"/>

    <!-- 眼睛 -->
    <circle cx="477" cy="206" r="10" fill="#ffffff"/>
    <circle cx="480" cy="207" r="4.5" fill="#212529"/>
    <circle cx="478" cy="204" r="1.6" fill="#ffffff"/>
    <circle cx="515" cy="208" r="11" fill="#ffffff"/>
    <circle cx="518" cy="209" r="5" fill="#212529"/>
    <circle cx="516" cy="205" r="2" fill="#ffffff"/>

    <!-- 眉毛 -->
    <path d="M 466 188 Q 477 182 488 187" fill="none" stroke="#d96a8e" stroke-width="3" stroke-linecap="round"/>
    <path d="M 505 189 Q 516 183 527 188" fill="none" stroke="#d96a8e" stroke-width="3" stroke-linecap="round"/>

    <!-- 猪鼻子 -->
    <ellipse cx="545" cy="235" rx="26" ry="21" fill="#f191ad" stroke="#d96a8e" stroke-width="2.5"/>
    <ellipse cx="537" cy="235" rx="5" ry="7.5" fill="#b04a6d"/>
    <ellipse cx="553" cy="235" rx="5" ry="7.5" fill="#b04a6d"/>

    <!-- 腮红 -->
    <ellipse cx="472" cy="248" rx="11" ry="8" fill="#f77fa0" opacity="0.55"/>

    <!-- 微笑 -->
    <path d="M 498 254 Q 512 267 528 256" fill="none" stroke="#b04a6d" stroke-width="3.5" stroke-linecap="round"/>

    <!-- 近侧手臂 -->
    <path d="M 420 285 Q 495 292 540 314" fill="none" stroke="#f9b3c6" stroke-width="15" stroke-linecap="round"/>
    <circle cx="542" cy="315" r="10" fill="#f9b3c6"/>
  </g>

  <!-- 对话气泡 -->
  <g>
    <rect x="598" y="112" width="206" height="58" rx="29" fill="#ffffff" stroke="#2b2d42" stroke-width="3"/>
    <path d="M 616 162 L 560 196 L 642 164 Z" fill="#ffffff" stroke="#2b2d42" stroke-width="3" stroke-linejoin="round"/>
    <text x="701" y="150" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b2d42">哼！骑车真带劲！</text>
  </g>

  <!-- 标题 -->
  <text x="450" y="58" text-anchor="middle" font-size="44" font-weight="bold"
        fill="#2b2d42" stroke="#ffffff" stroke-width="8" paint-order="stroke"
        font-family="'Microsoft YaHei','PingFang SC',sans-serif">猪八戒骑自行车</text>
</svg>
</div>

<div class="caption">纯 SVG 手绘 · 哼哼哼～</div>

</body>
</html>
